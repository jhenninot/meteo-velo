services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - 8085:80
    restart: always
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - 3001:3001
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URL=mongodb://mongodb:27017/meteo_velo
      - PORT=3001
      - FRONTEND_URL=${FRONTEND_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - STACK_DIR=/app/stack
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/dockhand/stacks/Production/meteo-velo:/app/stack
    restart: always
    depends_on:
      - mongodb
  mongodb:
    image: mongo:8.2
    container_name: mongodb
    ports:
      - 127.0.0.1:27017:27017 # Accessible uniquement depuis l'hôte (depuis ton PC : tunnel SSH, ex. ssh -L 27017:127.0.0.1:27017 serveur)
    volumes:
      - mongo_data:/data/db
    restart: always
volumes:
  mongo_data: null
