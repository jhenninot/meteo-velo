services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # On passe la variable de Dockge au Dockerfile
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "8085:80"
    restart: always

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=3001
    restart: always