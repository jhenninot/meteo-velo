version: '3.8'

services:
  backend:
    build: ./server
    container_name: velo-meteo-backend
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    build: ./client
    container_name: velo-meteo-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped